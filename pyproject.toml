[project]
name = "document-qa"
version = "0.1.0"
description = "Q&A system over PDF documents"
authors = [
    {name = "Iva"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pymupdf (>=1.27.2.3,<2.0.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "docling (>=2.96.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "google-genai (>=2.7.0,<3.0.0)",
    "groq (>=0.30.0,<1.0.0)",
    "langchain (>=1.3.2,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "faiss-cpu (>=1.14.2,<2.0.0)",
    "datasets (>=4.8.5,<5.0.0)",
    "ragas (==0.2.14)",
    "deepeval (>=4.0.5,<5.0.0)",
    "langchain-groq (>=1.1.2,<2.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "langsmith (>=0.8.11,<0.9.0)",
    "langgraph-cli[inmem] (>=0.4.27,<0.5.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"